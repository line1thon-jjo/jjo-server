[project]
name = "jjo-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "google-genai>=1.0",
    "google-auth[requests]>=2.0",
    "PyJWT>=2.10,<3",
    "python-multipart>=0.0.20,<0.1",
    # 음성 분석 엔진(app/speech). 녹음 디코딩에 ffmpeg 가 PATH 에 있어야 한다
    "numpy>=1.26",
    "praat-parselmouth>=0.4.5",
    "faster-whisper>=1.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
